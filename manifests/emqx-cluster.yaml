apiVersion: v1
kind: Namespace
metadata:
  name: omsl-mqtt
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-headless
  namespace: omsl-mqtt
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: mqtt
    port: 1883
  - name: erlang-dist
    port: 4370
  selector:
    app: emqx
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-service
  namespace: omsl-mqtt
spec:
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
  - name: dashboard
    port: 18083
    targetPort: 18083
  selector:
    app: emqx
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  namespace: omsl-mqtt
spec:
  serviceName: "emqx-headless"
  replicas: 3
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      containers:
      - name: emqx
        image: emqx:5.8.0
        ports:
        - name: mqtt
          containerPort: 1883
        - name: dashboard
          containerPort: 18083
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Nommage réseau stable basé sur le nom du pod
        - name: EMQX_NODE__NAME
          value: "emqx@$(POD_NAME).emqx-headless.omsl-mqtt.svc.cluster.local"
        # Changement de stratégie : on utilise une liste de serveurs statiques (le premier pod est la clé)
        - name: EMQX_CLUSTER__DISCOVERY_STRATEGY
          value: "static"
        - name: EMQX_CLUSTER__STATIC__SEEDS
          value: "emqx@emqx-0.emqx-headless.omsl-mqtt.svc.cluster.local"
        - name: EMQX_NODE__COOKIE
          value: "omsl_secret_cookie"
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "200m"
            memory: 512Mi